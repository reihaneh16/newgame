<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی جرم و حجم - طراح: خانم فخار</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, 'B Nazanin', 'Vazir', sans-serif;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #d1c4e9 100%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; position: relative; overflow-x: hidden;
}
.designer-badge {
    position: fixed; top: 15px; left: 15px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
    padding: 8px 18px; border-radius: 50px;
    font-size: 0.9rem; font-weight: bold; color: #6a1b9a;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 100;
    border: 2px solid #ce93d8;
    display: flex; align-items: center; gap: 6px;
}
.game-container {
    background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    border-radius: 40px; padding: 30px 25px;
    max-width: 680px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    border: 3px solid rgba(255,255,255,0.6);
    position: relative; z-index: 10;
}
.game-header { text-align: center; margin-bottom: 15px; }
.game-header h1 { font-size: 1.8rem; color: #4a148c; margin-bottom: 5px; }
.game-header p { font-size: 1rem; color: #7b1fa2; opacity: 0.8; }
.progress-bar {
    width: 100%; height: 14px; background: #e1bee7;
    border-radius: 20px; margin: 15px 0 20px; overflow: hidden;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.08);
}
.progress-fill {
    height: 100%; background: linear-gradient(90deg, #ce93d8, #8e24aa);
    border-radius: 20px; width: 0%; transition: width 0.5s ease;
}
.question-card {
    background: white; border-radius: 30px;
    padding: 22px 18px; box-shadow: 0 8px 25px rgba(106,27,154,0.12);
    margin-bottom: 18px; border: 2px solid #f3e5f5; text-align: center;
}
.question-number {
    display: inline-block; background: #8e24aa; color: white;
    padding: 4px 16px; border-radius: 50px;
    font-size: 0.85rem; font-weight: bold; margin-bottom: 12px;
}
.question-emoji { font-size: 3.2rem; display: block; margin-bottom: 8px; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
.question-text {
    font-size: 1.2rem; font-weight: bold; color: #2d2d2d;
    line-height: 1.7; margin-bottom: 18px;
}
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.option-btn {
    background: #f3e5f5; border: 3px solid transparent;
    border-radius: 20px; padding: 14px 10px;
    font-size: 0.95rem; font-family: inherit; font-weight: bold;
    color: #4a148c; cursor: pointer; transition: all 0.2s ease;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; min-height: 100px; justify-content: center;
}
.option-btn .opt-emoji { font-size: 2rem; }
.option-btn:hover:not(:disabled) {
    background: #e1bee7; transform: scale(1.04);
    border-color: #ce93d8; box-shadow: 0 8px 20px rgba(142,36,170,0.2);
}
.option-btn:active:not(:disabled) { transform: scale(0.97); }
.option-btn.correct {
    background: #c8e6c9 !important; border-color: #43a047 !important;
    color: #1b5e20; animation: pulseCorrect 0.6s ease;
}
.option-btn.wrong {
    background: #ffcdd2 !important; border-color: #e53935 !important;
    color: #b71c1c; animation: shake 0.5s ease;
}
.option-btn:disabled { cursor: default; opacity: 0.9; }
@keyframes pulseCorrect { 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 50%{transform:translateX(8px);} 75%{transform:translateX(-5px);} }
.feedback {
    margin-top: 15px; font-size: 1.05rem; font-weight: bold;
    min-height: 40px; display: flex; align-items: center;
    justify-content: center; gap: 8px; line-height: 1.6;
}
.feedback.correct-msg { color: #2e7d32; }
.feedback.wrong-msg { color: #c62828; }
.next-btn {
    background: linear-gradient(135deg, #8e24aa, #6a1b9a);
    color: white; border: none; border-radius: 50px;
    padding: 14px 40px; font-size: 1.05rem; font-weight: bold;
    font-family: inherit; cursor: pointer; transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(106,27,154,0.35);
    display: none; margin: 0 auto;
}
.next-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(106,27,154,0.45); }
.score-area { text-align: center; margin-top: 12px; font-size: 1rem; color: #7b1fa2; font-weight: bold; }
.result-screen { text-align: center; padding: 20px; display: none; }
.result-screen .result-emoji { font-size: 5rem; display: block; margin-bottom: 15px; animation: bounce 1.5s infinite; }
.result-screen h2 { color: #4a148c; font-size: 1.8rem; margin-bottom: 12px; }
.result-screen .final-score {
    font-size: 1.4rem; color: #6a1b9a; font-weight: bold;
    background: #f3e5f5; display: inline-block;
    padding: 10px 30px; border-radius: 50px; margin: 15px 0;
}
.result-screen p { color: #7b1fa2; font-size: 1.05rem; line-height: 1.8; }
.restart-btn {
    background: linear-gradient(135deg, #ff8a65, #f4511e);
    color: white; border: none; border-radius: 50px;
    padding: 14px 40px; font-size: 1.05rem; font-weight: bold;
    font-family: inherit; cursor: pointer; transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(244,81,30,0.35); margin-top: 20px;
}
.restart-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(244,81,30,0.45); }
.bg-stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-stars span { position: absolute; font-size: 1.5rem; opacity: 0.15; animation: floatStar 15s infinite linear; }
@keyframes floatStar { 0%{transform:translateY(100vh) rotate(0deg);} 100%{transform:translateY(-100px) rotate(360deg);} }
@media (max-width: 520px) {
    .options-grid { grid-template-columns: 1fr; }
    .question-text { font-size: 1.05rem; }
    .game-container { padding: 20px 15px; }
    .designer-badge { font-size: 0.75rem; padding: 6px 12px; }
    .question-emoji { font-size: 2.5rem; }
}
</style>
</head>
<body>

<div class="bg-stars" id="bgStars"></div>

<div class="designer-badge"><span>✏️</span> طراح: خانم فخار</div>

<div class="game-container" id="gameContainer">
    <div class="game-header" id="gameHeader">
        <h1>🧪 بازی جرم و حجم</h1>
        <p>بیا با هم دانشمند کوچک بشیم! 🔬</p>
    </div>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-card" id="questionCard">
        <div class="question-emoji" id="questionEmoji">⚖️</div>
        <div class="question-number" id="questionNumber">سوال ۱ از ۱۰</div>
        <div class="question-text" id="questionText">متن سوال</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <button class="next-btn" id="nextBtn">سوال بعدی ➡️</button>
    <div class="score-area" id="scoreArea">امتیاز: ۰ از ۱۰</div>

    <div class="result-screen" id="resultScreen">
        <span class="result-emoji" id="resultEmoji">🏆</span>
        <h2 id="resultTitle">آفرین!</h2>
        <div class="final-score" id="finalScore">۰ از ۱۰ درست!</div>
        <p id="resultMessage">تو یک دانشمند کوچک هستی! 🌟</p>
        <button class="restart-btn" id="restartBtn">🔄 دوباره بازی کن</button>
    </div>
</div>

<script>
// ====== ۱۰ سوال با ایموجی‌های خنثی برای همه گزینه‌ها ======
const questions = [
    // --- مرحله جرم (۴ سوال) ---
    {

            { text: "ساعت", emoji: "⏰", correct: false },

    },
    // ✅ سوال ۲ طبق درخواست شما تغییر کرد
    {
        emoji: "🍚⚖️",
        text: "جرم یک گونی برنج را با کدام یکا اندازه می‌گیرند؟",
        options: [
            { text: "گرم", emoji: "⚖️", correct: false },
            { text: "لیتر", emoji: "🧪", correct: false },
            { text: "کیلوگرم", emoji: "⚖️", correct: true },
            { text: "سانتی‌متر", emoji: "📐", correct: false }
        ],
        correctFeedback: "✅ عالی! جرم گونی برنج را با کیلوگرم اندازه می‌گیریم.",
        wrongFeedback: "❌ اشتباه بود! یکای مناسب برای جرم گونی برنج، کیلوگرم است. ⚖️"
    },
    {
        emoji: "🍬🔢",
        text: "جرم یک بسته قند ۲ کیلوگرم است. این مقدار چند گرم است؟",
        options: [
            { text: "۲۰۰ گرم", emoji: "🔢", correct: false },
            { text: "۲۰۰۰ گرم", emoji: "🔢", correct: true },
            { text: "۲۰ لیتر", emoji: "🧪", correct: false },

        ],
        correctFeedback: "✅ آفرین! هر کیلوگرم ۱۰۰۰ گرم است، پس ۲ کیلوگرم = ۲۰۰۰ گرم.",
        wrongFeedback: "❌ درست نبود! هر کیلوگرم ۱۰۰۰ گرم است، پس ۲ کیلوگرم = ۲۰۰۰ گرم. 🧮"
    },
    {
        emoji: "✏️🧮",
        text: "جرم هر بسته مداد ۵۰۰ گرم است. جرم دو بسته روی هم چقدر است؟",
        options: [
            { text: "۵۰۰ گرم", emoji: "✏️", correct: false },
            { text: "۱ کیلوگرم", emoji: "✏️", correct: true },
            { text: "۵ لیتر", emoji: "🧪", correct: false },
            { text: "۲ گرم", emoji: "🔢", correct: false }
        ],
        correctFeedback: "✅ عالی! ۵۰۰ + ۵۰۰ = ۱۰۰۰ گرم که همان ۱ کیلوگرم است.",
        wrongFeedback: "❌ اشتباه بود! ۵۰۰ + ۵۰۰ = ۱۰۰۰ گرم یعنی ۱ کیلوگرم. ⚖️"
    },

    // --- مرحله حجم (۳ سوال) ---
    {
        emoji: "🥛💧",
        text: "حجم یک لیوان آب به چه چیزی اشاره دارد؟",
        options: [
            { text: "مقدار فضایی که آب اشغال کرده", emoji: "📦", correct: true },
            { text: "رنگ آب", emoji: "🎨", correct: false },
            { text: "دمای آب", emoji: "🌡️", correct: false },
            { text: "مزه آب", emoji: "😋", correct: false }
        ],
        correctFeedback: "✅ آفرین! حجم یعنی مقدار فضایی که یک جسم یا مایع اشغال می‌کند.",
        wrongFeedback: "❌ درست نبود! حجم = مقدار فضایی که آب اشغال کرده است. 📦"
    },
    {
        emoji: "🧴📊",
        text: "برای اندازه‌گیری حجم مایعات، کدام وسیله مناسب‌تر است؟",
        options: [
            { text: "ترازو", emoji: "⚖️", correct: false },
            { text: "خط‌کش", emoji: "📏", correct: false },
            { text: "پیمانه مدرج", emoji: "🧪", correct: true },
            { text: "ساعت", emoji: "⏰", correct: false }
        ],
        correctFeedback: "✅ عالی! حجم مایعات را با پیمانه مدرج می‌سنجیم.",
        wrongFeedback: "❌ اشتباه بود! برای حجم مایعات از پیمانه مدرج استفاده می‌کنیم. 🧪"
    },
    {
        emoji: "🥤🧮",
        text: "یک بطری ۲ لیتری آب داریم. حجم آب آن چند میلی‌لیتر است؟",
        options: [
            { text: "۲۰ میلی‌لیتر", emoji: "🔢", correct: false },
            { text: "۲۰۰ میلی‌لیتر", emoji: "🔢", correct: false },
            { text: "۲۰۰۰ میلی‌لیتر", emoji: "🔢", correct: true },
            { text: "۲ میلی‌لیتر", emoji: "🔢", correct: false }
        ],
        correctFeedback: "✅ آفرین! هر لیتر ۱۰۰۰ میلی‌لیتر است، پس ۲ لیتر = ۲۰۰۰ میلی‌لیتر.",
        wrongFeedback: "❌ درست نبود! هر لیتر ۱۰۰۰ میلی‌لیتر است، پس ۲ لیتر = ۲۰۰۰ میلی‌لیتر. 🧮"
    },

    // --- مرحله تشخیص جرم و حجم (۳ سوال) ---
    {
        emoji: "🍫📏",
        text: "کدام مورد با «گرم» اندازه‌گیری می‌شود؟",
        options: [
            { text: "حجم آب استخر", emoji: "🏊", correct: false },
            { text: "جرم یک شکلات", emoji: "🍫", correct: true },
            { text: "حجم یک بطری شیر", emoji: "🥛", correct: false },
            { text: "طول یک مداد", emoji: "✏️", correct: false }
        ],
        correctFeedback: "✅ آفرین! گرم یکای جرم است و شکلات با گرم اندازه‌گیری می‌شود.",
        wrongFeedback: "❌ اشتباه بود! گرم یکای جرم است، پس جرم شکلات با گرم سنجیده می‌شود. 🍫"
    },
    {
        emoji: "⛽🧪",
        text: "کدام مورد با «لیتر» اندازه‌گیری می‌شود؟",
        options: [
            { text: "جرم یک پرتقال", emoji: "🍊", correct: false },
            { text: "جرم یک کتاب", emoji: "📖", correct: false },
            { text: "حجم بنزین داخل باک", emoji: "⛽", correct: true },
            { text: "طول یک میز", emoji: "📏", correct: false }
        ],
        correctFeedback: "✅ عالی! لیتر یکای حجم مایعات است، پس بنزین با لیتر اندازه‌گیری می‌شود.",
        wrongFeedback: "❌ درست نبود! لیتر یکای حجم است و بنزین مایع با لیتر سنجیده می‌شود. ⛽"
    },
    {
        emoji: "⚽🪨",
        text: "یک توپ و یک سنگ هم‌اندازه داریم. کدام جمله ممکن است درست باشد؟",
        options: [
            { text: "حتماً جرم توپ بیشتر است", emoji: "⚽", correct: false },
            { text: "حتماً جرم سنگ بیشتر است", emoji: "🪨", correct: false },
            { text: "حجمشان یکسان است، اما جرمشان می‌تواند متفاوت باشد", emoji: "🟰", correct: true },
            { text: "جرم و حجم همیشه برابر هستند", emoji: "⚖️", correct: false }
        ],
        correctFeedback: "✅ آفرین! حجم یکسان لزوماً به معنی جرم یکسان نیست.",
        wrongFeedback: "❌ دقت کن! دو جسم می‌توانند حجم یکسان داشته باشند اما جرمشان متفاوت باشد. 🧠"
    },
    // --- دو سوال پایانی (۲۳ و ۲۴) ---
    {
        emoji: "⚖️❓",
        text: "اگر بخواهیم جرم یک جسم را بدانیم، چه کاری انجام می‌دهیم؟",
        options: [
            { text: "آن را با ترازو اندازه می‌گیریم", emoji: "⚖️", correct: true },
            { text: "آن را با خط‌کش اندازه می‌گیریم", emoji: "📏", correct: false },
            { text: "رنگ آن را بررسی می‌کنیم", emoji: "🎨", correct: false },
            { text: "آن را در آب حل می‌کنیم", emoji: "💧", correct: false }
        ],
        correctFeedback: "✅ عالی! برای دانستن جرم، جسم را با ترازو وزن می‌کنیم.",
        wrongFeedback: "❌ اشتباه بود! جرم را با ترازو اندازه می‌گیریم. ⚖️"
    },
    {
        emoji: "🧴❓",
        text: "اگر بخواهیم بدانیم یک بطری چه مقدار آب در خود جای می‌دهد، چه چیزی را اندازه می‌گیریم؟",
        options: [
            { text: "جرم بطری", emoji: "⚖️", correct: false },
            { text: "طول بطری", emoji: "📏", correct: false },
            { text: "حجم بطری", emoji: "🧪", correct: true },
            { text: "دمای بطری", emoji: "🌡️", correct: false }
        ],
        correctFeedback: "✅ آفرین! مقدار آبی که یک بطری در خود جای می‌دهد، حجم آن است.",
        wrongFeedback: "❌ درست نبود! مقدار جای‌گیری آب در بطری، حجم بطری است. 🧪"
    }
];

// ====== متغیرهای بازی ======
let currentQuestion = 0;
let score = 0;
let answered = false;

// ====== عناصر DOM ======
const questionEmoji = document.getElementById('questionEmoji');
const questionNumber = document.getElementById('questionNumber');
const questionText = document.getElementById('questionText');
const optionsGrid = document.getElementById('optionsGrid');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const scoreArea = document.getElementById('scoreArea');
const questionCard = document.getElementById('questionCard');
const resultScreen = document.getElementById('resultScreen');
const resultEmoji = document.getElementById('resultEmoji');
const resultTitle = document.getElementById('resultTitle');
const finalScore = document.getElementById('finalScore');
const resultMessage = document.getElementById('resultMessage');
const restartBtn = document.getElementById('restartBtn');
const gameHeader = document.getElementById('gameHeader');
const progressBar = document.getElementById('progressBar');

// ====== ستاره‌های پس‌زمینه ======
(function createStars() {
    const container = document.getElementById('bgStars');
    const emojis = ['⭐','✨','🌟','💫','⚗️','🔬','🧪','⚖️','📏','🧴'];
    for (let i = 0; i < 22; i++) {
        const span = document.createElement('span');
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
        span.style.animationDuration = (Math.random() * 10 + 10) + 's';
        span.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(span);
    }
})();

// ====== توابع بازی ======
function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    questionNumber.textContent = `سوال ${currentQuestion + 1} از ${questions.length}`;
    questionEmoji.textContent = q.emoji;
    questionText.textContent = q.text;

    optionsGrid.innerHTML = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
    nextBtn.style.display = 'none';

    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-emoji">${opt.emoji}</span><span>${opt.text}</span>`;
        btn.addEventListener('click', () => selectOption(index, btn));
        optionsGrid.appendChild(btn);
    });

    progressFill.style.width = (currentQuestion / questions.length) * 100 + '%';
    scoreArea.textContent = `امتیاز: ${score} از ${questions.length}`;
}

function selectOption(index, btn) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allButtons = optionsGrid.querySelectorAll('.option-btn');
    allButtons.forEach(b => b.disabled = true);

    if (q.options[index].correct) {
        btn.classList.add('correct');
        score++;
        feedback.textContent = q.correctFeedback;
        feedback.className = 'feedback correct-msg';
    } else {
        btn.classList.add('wrong');
        feedback.textContent = q.wrongFeedback;
        feedback.className = 'feedback wrong-msg';
        allButtons.forEach((b, i) => {
            if (q.options[i].correct) b.classList.add('correct');
        });
    }

    scoreArea.textContent = `امتیاز: ${score} از ${questions.length}`;
    progressFill.style.width = ((currentQuestion + 1) / questions.length) * 100 + '%';

    nextBtn.style.display = 'block';
    nextBtn.textContent = currentQuestion === questions.length - 1 ? 'دیدن نتیجه 🏁' : 'سوال بعدی ➡️';
}

function goToNext() {
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    questionCard.style.display = 'none';
    nextBtn.style.display = 'none';
    scoreArea.style.display = 'none';
    gameHeader.style.display = 'none';
    progressBar.style.display = 'none';
    resultScreen.style.display = 'block';

    finalScore.textContent = `${score} از ${questions.length} درست!`;

    if (score === questions.length) {
        resultEmoji.textContent = '🏆🌟';
        resultTitle.textContent = 'عالی بود!';
        resultMessage.textContent = 'تو یک دانشمند کوچک واقعی هستی! همه سوال‌ها را درست جواب دادی! 🎉';
    } else if (score >= questions.length * 0.7) {
        resultEmoji.textContent = '👏😊';
        resultTitle.textContent = 'خیلی خوب بود!';
        resultMessage.textContent = 'تلاش خوبی داشتی! کمی تمرین بیشتر و همه سوال‌ها را درست جواب می‌دهی! 💪';
    } else if (score >= questions.length * 0.4) {
        resultEmoji.textContent = '💡🙂';
        resultTitle.textContent = 'خوب بود!';
        resultMessage.textContent = 'داری یاد می‌گیری! دوباره بازی کن تا بهتر بشی. 🌱';
    } else {
        resultEmoji.textContent = '🤔🌈';
        resultTitle.textContent = 'اشکالی ندارد!';
        resultMessage.textContent = 'یادگیری یک ماجراجویی است! دوباره تلاش کن تا بهتر یاد بگیری! 🚀';
    }
}

function restartGame() {
    currentQuestion = 0;
    score = 0;
    answered = false;

    questionCard.style.display = 'block';
    scoreArea.style.display = 'block';
    gameHeader.style.display = 'block';
    progressBar.style.display = 'block';
    resultScreen.style.display = 'none';
    progressFill.style.width = '0%';

    loadQuestion();
}

nextBtn.addEventListener('click', goToNext);
restartBtn.addEventListener('click', restartGame);

loadQuestion();
</script>
</body>
</html>
